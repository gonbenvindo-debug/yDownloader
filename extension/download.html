<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download local · yDownloader</title>
  <link rel="stylesheet" href="download.css">
  <script src="download.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">yDownloader</p>
    <h1>Guardar vídeo</h1>
    <p id="video-title" class="video-title">A preparar o vídeo…</p>
    <p id="status" role="status" aria-live="polite">A obter os formatos disponíveis.</p>
    <div class="actions">
      <button id="save" type="button" disabled>Escolher ficheiro e descarregar</button>
      <button id="cancel" class="secondary" type="button" hidden>Cancelar</button>
    </div>
    <p class="note">O vídeo e o áudio são transferidos diretamente do YouTube e unidos neste browser. O conteúdo não passa por um servidor yDownloader.</p>
  </main>
</body>
</html>
